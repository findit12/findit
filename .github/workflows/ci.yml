name: CI
on:
  push:
    branches: [Main, feature/nestjs-typeorm-migration]
  pull_request:
    branches: [Main, feature/nestjs-typeorm-migration]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm ci --prefix client
      - run: npm ci --prefix server
      - name: Lint
        run: npm run lint
      - run: npm run build
      - name: Test with coverage (fails under 80 % lines, statements, functions and 70 % branches)
        run: npm run test:cov --prefix server
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: server/coverage
      - name: Verify no .js files exist in TypeScript source directories
        run: test -z "$(find client/src server/src -name '*.js' -print -quit)"
